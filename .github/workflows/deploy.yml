name: Deploy

# push 到 main 时自动部署到板端（经 Cloudflare Tunnel SSH 隧道）
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to board
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Write board SSH key
        run: |
          echo "$BOARD_SSH_KEY" > /tmp/board_key
          chmod 600 /tmp/board_key
        env:
          BOARD_SSH_KEY: ${{ secrets.BOARD_SSH_KEY }}

      - name: Deploy via Cloudflare Tunnel SSH
        run: |
          set -e
          # 解析 Service Token (格式: ID:SECRET)
          CF_ID="${CLOUDFLARED_TOKEN%%:*}"
          CF_SECRET="${CLOUDFLARED_TOKEN#*:}"

          # 启动 cloudflared access tcp 转发: 本地 2222 -> Cloudflare 边缘 -> 板子 sshd
          cloudflared access tcp \
            --hostname ssh.632-8nm.cloud \
            --url localhost:2222 \
            --service-token-id "$CF_ID" \
            --service-token-secret "$CF_SECRET" \
            --log-level warn > /tmp/cf-tcp.log 2>&1 &
          CF_PID=$!
          trap "kill $CF_PID 2>/dev/null || true" EXIT

          # 等待转发就绪（重试 SSH 连接，不依赖 ss 命令）
          echo "==> 等待隧道就绪并 SSH 连接板子"
          SSH_OK=0
          for i in $(seq 1 15); do
            if ssh -i /tmp/board_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
                -o ConnectTimeout=10 -p 2222 orangepi@127.0.0.1 'true' 2>/dev/null; then
              SSH_OK=1
              break
            fi
            sleep 1
          done
          if [ "$SSH_OK" != "1" ]; then
            echo "错误: 无法通过隧道连接板子，cloudflared 日志:"
            cat /tmp/cf-tcp.log
            exit 1
          fi

          # 通过转发端口 SSH 执行部署
          echo "==> 执行部署"
          ssh -i /tmp/board_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 -p 2222 orangepi@127.0.0.1 '
            set -e
            echo "==> 板端自动部署开始"
            cd /home/orangepi/project/remote-wakeup
            echo "==> git pull"
            git pull --ff-only
            echo "==> 运行 dev.sh (构建并重启服务)"
            ./dev.sh
            echo "==> 部署完成"
          '
        env:
          CLOUDFLARED_TOKEN: ${{ secrets.CLOUDFLARED_TOKEN }}
